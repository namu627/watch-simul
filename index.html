<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Collection Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="watch-case-container">
            <div id="watchCase" class="watch-case">
                <div class="slots-container">
                    <div class="slot" data-slot-id="1"></div>
                    <div class="slot" data-slot-id="2"></div>
                    <div class="slot" data-slot-id="3"></div>
                    <div class="slot" data-slot-id="4"></div>
                </div>
            </div>
        </section>

        <hr>

        <section class="watch-list-container">
            <h2>Watches</h2>
            <div id="brandFilter" class="brand-filter"></div>
            <div id="watchList" class="watch-list">
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 시계 컬렉션 모의 구성</p>
    </footer>

    <script src="watches.js"></script>
    <script src="script.js"></script>
</body>
</html>
